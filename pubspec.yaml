name: shishur_dinlipi
description: Offline-first child development journal (শিশুর দিনলিপি).
publish_to: "none"

# versionName+versionCode — bump versionName for releases, versionCode every store build.
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2

  # Local data
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  sqlite3: ^3.0.0

  # Identity & i18n
  uuid: ^4.5.1
  intl: ^0.20.2

  # Security
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # Media & sharing
  image_picker: ^1.1.2
  share_plus: ^10.1.4

  # Notifications
  flutter_local_notifications: ^19.2.1
  timezone: ^0.10.1

  # PDF / backup helpers
  pdf: ^3.11.3
  printing: ^5.14.2
  archive: ^4.0.7
  crypto: ^3.0.6

  # Charts
  fl_chart: ^0.71.0
  image: ^4.10.1
  permission_handler: ^13.0.2
  flutter_timezone: ^5.1.1
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/NotoSansBengali-Regular.ttf
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/LICENSE-NotoSansBengali.txt
    - assets/fonts/LICENSE-NotoSans.txt
